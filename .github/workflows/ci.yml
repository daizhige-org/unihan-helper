name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUSKY: 0

jobs:
  check:
    timeout-minutes: 15
    # Playwright 1.56 不支持 ubuntu-latest 现在指向的 26.04，升级 Playwright 前先固定
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 版本取自 package.json 的 packageManager，此处再指定会报错
          run_install: true
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Install Chromium for smoke tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test built gadget
        run: pnpm test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
